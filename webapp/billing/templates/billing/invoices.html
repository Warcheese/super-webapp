{% extends 'billing/base.html' %}{% block content %}<section class="page-heading"><div><div class="eyebrow">VOM ENTWURF BIS ZUR ZAHLUNG</div><h1>Rechnungen</h1><p>Deine Rechnungen, ordentlich an einem Ort.</p></div><a class="button" href="{% url 'invoice_new' %}">+ Neue Rechnung</a></section>
<form class="searchbar" method="get"><label class="sr-only" for="q">Rechnungen suchen</label><input id="q" name="q" value="{{ query }}" placeholder="Name oder Rechnungsnummer …"><label class="sr-only" for="status">Status</label><select id="status" name="status"><option value="">Alle Rechnungen</option value="draft" {% if status == 'draft' %}selected{% endif %}>Entwürfe</option><option value="open" {% if status == 'open' %}selected{% endif %}>Offen</option><option value="paid" {% if status == 'paid' %}selected{% endif %}>Bezahlt</option></select><button class="button secondary">Filtern</button></form>
<section class="panel">{% include 'billing/invoice_table.html' %}<p class="panel-foot">Es werden höchstens 200 Treffer angezeigt.</p></section>{% endblock %}
