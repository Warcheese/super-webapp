{% if form.non_field_errors %}<div class="notice error">{{ form.non_field_errors }}</div>{% endif %}<div class="form-grid">{% for field in form %}<div class="field {% if field.field.widget.input_type == 'checkbox' %}check-field{% endif %} {% if field.name == 'diagnosis' or field.name == 'greeting_messages' %}wide{% endif %}">{% if field.field.widget.input_type == 'checkbox' %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{% else %}{{ field.label_tag }}{% endif %}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>{% endfor %}</div>
